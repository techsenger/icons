name: Build MDI Extension Font

on:
  push:
    branches:
      - main
  workflow_dispatch:

# No permissions by default: every job asks only for what it needs.
permissions: {}

jobs:
  # Runs third-party code (pip packages), so it has a read-only token and cannot publish anything.
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The version lives in the VERSION file of the project root.
      - name: Read version
        id: version
        run: |
          VERSION=$(head -n 1 VERSION | tr -d '[:space:]')
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT)?$ ]]; then
            echo "The VERSION file does not contain a valid version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install "fonttools[lxml]"

      - name: Generate TTF font
        working-directory: mdi
        run: |
          python3 ttfgenerator.py

      # One archive for all icon sets: every set has its own folder with the font and the license.
      - name: Prepare distribution
        run: |
          mkdir -p dist/mdi
          cp mdi/techsenger-icons-mdi.ttf mdi/LICENSE.txt dist/mdi/

      - name: Upload distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: techsenger-icons-${{ steps.version.outputs.version }}
          path: dist

  # The only job with the write token. It runs no third-party code except the actions pinned by commit, and publishes
  # only what is built from the main branch.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: icons-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: Download distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: techsenger-icons-${{ needs.build.outputs.version }}
          path: dist

      # A SNAPSHOT version goes to the single snapshot release: every build moves its tag to the current commit and
      # replaces the file. Any other version gets its own release that is never changed.
      - name: Publish release
        run: |
          ZIP="techsenger-icons-$VERSION.zip"
          (cd dist && zip -r "../$ZIP" .)
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            gh release view snapshot > /dev/null 2>&1 || gh release create snapshot \
              --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Snapshot" --notes "Latest development build of the icons."
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/snapshot" -f sha="$GITHUB_SHA" -F force=true
            gh release upload snapshot "$ZIP" --clobber
            gh release view snapshot --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              if [[ "$asset" != "$ZIP" ]]; then
                gh release delete-asset snapshot "$asset" --yes
              fi
            done
          else
            gh release create "v$VERSION" "$ZIP" --target "$GITHUB_SHA" \
              --title "$VERSION" --notes "Techsenger Icons $VERSION."
          fi
